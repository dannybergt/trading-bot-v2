name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish nur technisch pruefen, ohne Docker-Hub-Push"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # build.sh derives APP_VERSION from `git describe --tags --always`.
          # The default shallow clone carries no tags and no history, so
          # describe falls through to its --always fallback and the published
          # image is labelled with a bare short SHA instead of a readable
          # version. Full history + tags is what makes the version meaningful.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Determine publish mode
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "PUBLISH_DRY_RUN=1" >> "${GITHUB_ENV}"
          else
            echo "PUBLISH_DRY_RUN=0" >> "${GITHUB_ENV}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "PRIMARY_IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
            echo "SYNC_LATEST=0" >> "${GITHUB_ENV}"
          else
            echo "PRIMARY_IMAGE_TAG=sha-${GITHUB_SHA::12}" >> "${GITHUB_ENV}"
            echo "SYNC_LATEST=1" >> "${GITHUB_ENV}"
          fi

      - name: Prepare env
        env:
          # Secrets ueber env statt im Skripttext (kein Interpolieren in run:)
          DH_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          cp .env.example .env
          {
            echo "BACKEND_IMAGE_NAME=trading-bot-backend"
            echo "FRONTEND_IMAGE_NAME=trading-bot-frontend"
            echo "IMAGE_TAG=${PRIMARY_IMAGE_TAG}"
          } >> .env
          if [[ -n "${DH_NAMESPACE}" ]]; then
            echo "DOCKERHUB_NAMESPACE=${DH_NAMESPACE}" >> .env
          fi

      - name: Run build hook
        run: ./ops/automation/build.sh

      - name: Run test hook
        run: ./ops/automation/test.sh

      - name: Run API regression hook
        run: SKIP_BUILD=1 bash tests/run-api-regression.sh

      - name: Run UI regression hook
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          UI_ARTIFACT_DIR: artifacts/ui-regression
        run: SKIP_BUILD=1 bash tests/run-ui-regression.sh

      - name: Install frontend source dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build frontend source
        working-directory: src/frontend
        run: npm run build

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy fest (Default der Action ist v0.70.0, GHSA-mcj4-mphf-j9ff); Dependabot pflegt diesen Wert nicht.
          version: v0.76.1
          image-ref: trading-bot-v2-backend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy fest (Default der Action ist v0.70.0, GHSA-mcj4-mphf-j9ff); Dependabot pflegt diesen Wert nicht.
          version: v0.76.1
          image-ref: trading-bot-v2-frontend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload UI regression artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-regression-artifacts-${{ github.run_id }}
          path: artifacts/ui-regression
          if-no-files-found: ignore

      - name: Validate Docker Hub secrets
        if: env.PUBLISH_DRY_RUN != '1'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          if [[ -z "${DH_USER}" ]]; then
            missing+=("DOCKERHUB_USERNAME")
          fi
          if [[ -z "${DH_TOKEN}" ]]; then
            missing+=("DOCKERHUB_TOKEN")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing Docker Hub secrets::Missing required repository secrets: ${missing[*]}. Configure them in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: env.PUBLISH_DRY_RUN != '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync primary image tag
        env:
          DRY_RUN: ${{ env.PUBLISH_DRY_RUN }}
          SKIP_BUILD: 1
        run: ./ops/automation/sync-components.sh

      - name: Sync latest image tag
        if: env.SYNC_LATEST == '1'
        env:
          DRY_RUN: ${{ env.PUBLISH_DRY_RUN }}
          SKIP_BUILD: 1
          IMAGE_TAG: latest
        run: ./ops/automation/sync-components.sh

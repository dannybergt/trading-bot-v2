name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as publish.yml: build.sh runs here too, so a shallow
          # clone would make the CI build log report a bare SHA as the version.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Run build hook
        run: ./ops/automation/build.sh

      - name: Run test hook
        run: ./ops/automation/test.sh

      - name: Run API regression hook
        run: SKIP_BUILD=1 bash tests/run-api-regression.sh

      - name: Run UI regression hook
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          UI_ARTIFACT_DIR: artifacts/ui-regression
        run: SKIP_BUILD=1 bash tests/run-ui-regression.sh

      - name: Upload UI regression artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-regression-artifacts
          path: artifacts/ui-regression
          if-no-files-found: ignore

      - name: Install frontend source dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build frontend source
        working-directory: src/frontend
        run: npm run build

      - name: Run security scan hook
        run: ./ops/automation/scan.sh

      - name: Dependency audit (pip-audit on the image, npm audit on the lockfile)
        run: ./ops/automation/deps-audit.sh

      - name: Trivy backend image scan
        # Also after a red dependency audit, so the image findings are visible.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy fest (Default der Action ist v0.70.0, GHSA-mcj4-mphf-j9ff); Dependabot pflegt diesen Wert nicht.
          version: v0.76.1
          image-ref: trading-bot-v2-backend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Trivy frontend image scan
        # Also after a red dependency audit, so the image findings are visible.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Trivy fest (Default der Action ist v0.70.0, GHSA-mcj4-mphf-j9ff); Dependabot pflegt diesen Wert nicht.
          version: v0.76.1
          image-ref: trading-bot-v2-frontend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          trivyignores: .trivyignore

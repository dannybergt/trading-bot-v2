# Concurrent restore uploads (see the upload blocks below). http context:
# this file is included from nginx.conf's http block.
limit_conn_zone $binary_remote_addr zone=tbv2_upload_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Declare the encoding explicitly. Without this nginx serves "text/html"
    # with no charset, and an upstream reverse proxy fills the gap with its own
    # default -- the Apache in front of the public domain appends
    # "charset=ISO-8859-1", which per HTML spec outranks the <meta charset>
    # in the document. Today that is invisible because index.html happens to be
    # pure ASCII and module scripts are always decoded as UTF-8, but any
    # non-ASCII character added to the shell would render as mojibake on the
    # public domain while looking fine on the internal port.
    charset utf-8;

    # --- Security headers ---
    # HSTS only kicks in over HTTPS; harmless on plain-HTTP local dev
    # because browsers ignore it without a TLS connection.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # CSP tuned for a Vite-built React SPA. The 'unsafe-inline' on style
    # is required by Tailwind's runtime injection of utility-class CSS;
    # 'unsafe-inline' on script is the cost of Vite's small bootstrap
    # script. data: image and font sources cover Tailwind/inline SVGs.
    # connect-src includes wss: + ws: for the Alpaca-backed websocket
    # path under /ws and api requests under /api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss: ws:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Request bodies: 1 MB for the whole API (nginx default, written out so it
    # is a decision, not an accident) -- JSON calls are small, and every byte
    # nginx accepts is buffered before the backend can say no.
    client_max_body_size 1m;

    # The two admin restore uploads take a whole backup file. The backend caps
    # the file at ADMIN_UPLOAD_MAX_BYTES (50 MiB, main.py); with nginx at 1 MB
    # a restore above 1 MB died here with an nginx 413 page and never reached
    # that check. 51m = the backend cap plus 1 MiB for the multipart envelope,
    # so the backend stays the one that decides about the file itself and
    # nginx only stops bodies the backend would refuse anyway -- before they
    # reach it (docker-compose.yml publishes no backend port; this is the
    # only way in on the deployed stack).
    # Exact match plus a URI in proxy_pass, never a regex block with a bare
    # proxy_pass: nginx picks the block by the normalised path, a bare
    # proxy_pass forwards the client's raw path, so
    # `/api/watchlists/1/items/../../../admin/import` would pick the 51m block
    # and still reach the {symbol:path} route. With a URI the backend only
    # ever sees these two paths.
    # 300 s read/send: a 50 MiB restore parses and replaces every table in one
    # request; at the 60 s default nginx answers 504 while the restore goes on
    # (check the audit event before retrying -- docs/admin/runbook.md).
    # Cap, deliberately: raising ADMIN_UPLOAD_MAX_BYTES above 50 MiB needs
    # this number raised with it (tests/test_frontend_nginx_conf.py pins both).
    location = /api/admin/import {
        limit_except POST { deny all; }
        # No body is buffered for a caller without a bearer token: the admin
        # check only runs after nginx and Starlette have both spooled the
        # upload. Format check only -- the backend still verifies the token.
        if ($http_authorization !~* "^Bearer [A-Za-z0-9._~+/=-]+$") { return 401; }
        # Cap, deliberately: behind the public Apache $binary_remote_addr is
        # the proxy, so this is 2 concurrent restores in total -- fine for an
        # admin-only path; per-client limits would need real_ip first.
        limit_conn tbv2_upload_conn 2;
        client_body_timeout 15s;
        client_max_body_size 51m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8000/api/admin/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/backups/import {
        limit_except POST { deny all; }
        # No body is buffered for a caller without a bearer token: the admin
        # check only runs after nginx and Starlette have both spooled the
        # upload. Format check only -- the backend still verifies the token.
        if ($http_authorization !~* "^Bearer [A-Za-z0-9._~+/=-]+$") { return 401; }
        # Cap, deliberately: behind the public Apache $binary_remote_addr is
        # the proxy, so this is 2 concurrent restores in total -- fine for an
        # admin-only path; per-client limits would need real_ip first.
        limit_conn tbv2_upload_conn 2;
        client_body_timeout 15s;
        client_max_body_size 51m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8000/api/admin/backups/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
